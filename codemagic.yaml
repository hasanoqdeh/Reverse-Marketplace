workflows:

  # ─── iOS — real device build ─────────────────────────────────────────────────
  ios-device:
    name: iOS Device (Ad Hoc)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        APP_NAME:   ReverseMarketplaceBuyer
        BUNDLE_ID:  com.reversemarketplacebuyer
        NO_FLIPPER: "1"    # Flipper conflicts with Firebase on RN 0.72 — keep disabled
      # ── IMPORTANT ───────────────────────────────────────────────────────────
      # Secrets added in the Codemagic UI belong to a *variable group*. That
      # group MUST be listed here, otherwise the variables are NOT injected and
      # decode to empty strings ("CM_CERTIFICATE decoded to an empty file").
      # Create a group in: App settings → Environment variables → Group name,
      # then make the name below match it exactly.
      groups:
        - ios_signing
      node: "20.20.0"
      xcode: latest
      cocoapods: default
      # ── Required secrets (add to the 'ios_signing' group in the Codemagic UI) ─
      #   APPLE_TEAM_ID             — 10-char Apple Developer Team ID
      #   CM_CERTIFICATE            — base64 of .p12 distribution certificate
      #   CM_CERTIFICATE_PASSWORD   — .p12 password
      #   CM_PROVISIONING_PROFILE   — base64 of Ad Hoc .mobileprovision
      #   GOOGLE_SERVICE_INFO_PLIST — base64 of GoogleService-Info.plist (Firebase)
      #                               Generate: base64 -i GoogleService-Info.plist | pbcopy
    cache:
      cache_paths:
        - app/node_modules
        - app/ios/Pods
    scripts:

      # ── 1. Node dependencies ─────────────────────────────────────────────────
      - name: Install Node dependencies
        script: cd app && npm install

      # ── 2. Generate ios/ from the RN template ────────────────────────────────
      #       Skipped when ios/Podfile already exists in the repo.
      - name: Generate iOS project from template
        script: |
          if [ -d "app/ios" ] && [ -f "app/ios/Podfile" ]; then
            echo "ios/ already exists — skipping generation."
            exit 0
          fi

          TEMPLATE="app/node_modules/react-native/template/ios"
          if [ ! -d "$TEMPLATE" ]; then
            echo "ERROR: RN template not found at $TEMPLATE"
            exit 1
          fi

          # ── Fix: cp -r into an existing directory copies the source as a
          # subdirectory (app/ios/ios/), not in-place.  We must remove app/ios/
          # first so the template lands AS app/ios/ (the correct level).
          # Preserve any Pods that Codemagic already restored from cache.
          if [ -d "app/ios/Pods" ]; then
            echo "Preserving cached Pods…"
            mv app/ios/Pods /tmp/_ios_pods_cache
          fi
          rm -rf app/ios
          cp -r "$TEMPLATE" app/ios
          if [ -d "/tmp/_ios_pods_cache" ]; then
            mv /tmp/_ios_pods_cache app/ios/Pods
            echo "Pods cache restored."
          fi

          # Detect the placeholder name from the .xcodeproj directory.
          # This is the only reliable source — listing the dir and filtering by
          # name is fragile (it can pick up .xcode.env, .gitignore, etc.).
          # e.g. "HelloWorld.xcodeproj" → placeholder "HelloWorld".
          PLACEHOLDER=$(ls app/ios | grep '\.xcodeproj$' | head -1 | sed 's/\.xcodeproj$//')
          if [ -z "$PLACEHOLDER" ]; then
            echo "ERROR: could not detect placeholder (.xcodeproj not found)."
            ls -la app/ios/
            exit 1
          fi
          echo "Placeholder: $PLACEHOLDER → $APP_NAME"

          # Replace placeholder → APP_NAME in every source file
          # macOS BSD sed requires an explicit empty-string extension after -i
          find app/ios -type f \( \
            -name "*.h"          -o -name "*.m"          -o -name "*.mm"       \
            -o -name "*.swift"   -o -name "*.plist"       -o -name "*.storyboard" \
            -o -name "*.pbxproj" -o -name "*.xcscheme"    -o -name "Podfile" \) \
            -exec sed -i "" "s/$PLACEHOLDER/$APP_NAME/g" {} \;

          # Rename directories and files.
          # IMPORTANT: rename only the BASENAME of each entry, and use
          # `find -depth` so children are renamed before their parent dir.
          # The previous approach substituted the placeholder across the WHOLE
          # path at once — so moving e.g.
          #   HelloWorld.xcodeproj/.../HelloWorld.xcscheme
          # targeted a parent dir (ReverseMarketplaceBuyer.xcodeproj) that did
          # not exist yet, the mv failed silently, and the scheme kept its old
          # name → "workspace does not contain a scheme named ...".
          find app/ios -depth -name "*${PLACEHOLDER}*" | while IFS= read -r old; do
            dir=$(dirname "$old")
            base=$(basename "$old")
            newbase="${base//$PLACEHOLDER/$APP_NAME}"
            if [ "$base" != "$newbase" ]; then
              mv "$dir/$base" "$dir/$newbase"
            fi
          done

          # Confirm the expected app directory was produced
          if [ ! -d "app/ios/$APP_NAME" ]; then
            echo "ERROR: expected app/ios/$APP_NAME to be a directory after generation."
            echo "Contents of app/ios/:"
            ls -la app/ios/
            exit 1
          fi

          # Confirm the shared scheme was renamed correctly (xcodebuild needs it)
          SCHEME="app/ios/$APP_NAME.xcodeproj/xcshareddata/xcschemes/$APP_NAME.xcscheme"
          if [ ! -f "$SCHEME" ]; then
            echo "ERROR: expected shared scheme not found at $SCHEME"
            echo "Schemes present:"
            find "app/ios/$APP_NAME.xcodeproj" -name "*.xcscheme" 2>/dev/null
            exit 1
          fi
          echo "Scheme OK: $SCHEME"

          # Set bundle ID
          INFO_PLIST="app/ios/$APP_NAME/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$INFO_PLIST"
            echo "Bundle ID → $BUNDLE_ID"
          fi

          echo "ios/ folder ready."

      # ── 3. GoogleService-Info.plist ──────────────────────────────────────────
      #       @react-native-firebase adds a Copy build phase that FAILS at
      #       archive time if this file is absent.  Decode from the secret
      #       env var; fall back to a structure-valid placeholder so the build
      #       still completes (Firebase won't connect but the IPA is produced).
      #
      #       Written in Python (not a shell heredoc) so YAML linter indentation
      #       cannot break the terminator and cause "unexpected end of file".
      - name: Set up GoogleService-Info.plist
        script: |
          python3 - <<'PYEOF'
          import os, base64
          
          APP_NAME  = os.environ['APP_NAME']
          BUNDLE_ID = os.environ['BUNDLE_ID']
          plist_dir  = f"app/ios/{APP_NAME}"
          plist_path = f"{plist_dir}/GoogleService-Info.plist"
          
          os.makedirs(plist_dir, exist_ok=True)
          
          secret = os.environ.get('GOOGLE_SERVICE_INFO_PLIST', '').strip()
          if secret:
              with open(plist_path, 'wb') as f:
                  f.write(base64.b64decode(secret))
              print("GoogleService-Info.plist injected from secret.")
          else:
              print("WARNING: GOOGLE_SERVICE_INFO_PLIST not set — writing structure-valid placeholder.")
              lines = [
                  '<?xml version="1.0" encoding="UTF-8"?>',
                  '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"'
                  ' "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
                  '<plist version="1.0">',
                  '<dict>',
                  '  <key>API_KEY</key>               <string>placeholder</string>',
                  '  <key>GCM_SENDER_ID</key>         <string>000000000000</string>',
                  '  <key>PLIST_VERSION</key>         <string>1</string>',
                  f'  <key>BUNDLE_ID</key>             <string>{BUNDLE_ID}</string>',
                  '  <key>PROJECT_ID</key>            <string>placeholder-project</string>',
                  '  <key>STORAGE_BUCKET</key>        <string>placeholder-project.appspot.com</string>',
                  '  <key>IS_ADS_ENABLED</key>        <false/>',
                  '  <key>IS_ANALYTICS_ENABLED</key>  <false/>',
                  '  <key>IS_APPINVITE_ENABLED</key>  <false/>',
                  '  <key>IS_GCM_ENABLED</key>        <true/>',
                  '  <key>IS_SIGNIN_ENABLED</key>     <false/>',
                  '  <key>GOOGLE_APP_ID</key>         <string>1:000000000000:ios:0000000000000000000000</string>',
                  '</dict>',
                  '</plist>',
              ]
              with open(plist_path, 'w') as f:
                  f.write('\n'.join(lines) + '\n')
              print("Placeholder written.")
          PYEOF

      # ── 4. Patch Podfile ─────────────────────────────────────────────────────
      #       Fixes three issues that every build hits with this dependency set:
      #         a) Firebase Swift pods need GoogleUtilities module maps
      #         b) react-native-permissions 3.x needs setup_permissions([...])
      #         c) $RNFirebaseAsStaticFramework for static-library Firebase
      - name: Patch Podfile
        script: |
          PODFILE="app/ios/Podfile"
          [ -f "$PODFILE" ] || { echo "ERROR: Podfile missing"; exit 1; }

          python3 - <<'PYEOF'
          import re
          
          PODFILE = "app/ios/Podfile"
          with open(PODFILE) as f:
              src = f.read()
          
          changed = False
          
          # ── a) $RNFirebaseAsStaticFramework ──────────────────────────────────────────
          # Must be declared before any `require` so @react-native-firebase and
          # react-native-maps (Google Maps) configure Firebase as static frameworks.
          if '$RNFirebaseAsStaticFramework' not in src:
              src = '$RNFirebaseAsStaticFramework = true\n\n' + src
              changed = True
              print("+ $RNFirebaseAsStaticFramework = true")
          
          # ── b) use_modular_headers! ───────────────────────────────────────────────────
          # FirebaseCoreInternal (Swift) imports GoogleUtilities which has no module map.
          # CocoaPods generates one automatically when this flag is present.
          if 'use_modular_headers!' not in src:
              src = re.sub(r'(platform :ios[^\n]*\n)', r'\1use_modular_headers!\n', src, count=1)
              changed = True
              print("+ use_modular_headers!")
          
          # ── c) react-native-permissions 3.8.4 handler pods ──────────────────────────
          # v3.x has NO setup_permissions() helper — that arrived in v4. Instead
          # each permission handler ships as its own pod (Permission-Camera, …)
          # that must be declared INSIDE the app target. Without these the JS
          # permission checks return "unavailable" at runtime.
          PERM_PODS = """\
            permissions_path = '../node_modules/react-native-permissions/ios'
            pod 'Permission-Camera',              :path => "#{permissions_path}/Camera"
            pod 'Permission-LocationAlways',      :path => "#{permissions_path}/LocationAlways"
            pod 'Permission-LocationWhenInUse',   :path => "#{permissions_path}/LocationWhenInUse"
            pod 'Permission-Microphone',          :path => "#{permissions_path}/Microphone"
            pod 'Permission-Notifications',       :path => "#{permissions_path}/Notifications"
            pod 'Permission-PhotoLibrary',        :path => "#{permissions_path}/PhotoLibrary"
            pod 'Permission-PhotoLibraryAddOnly', :path => "#{permissions_path}/PhotoLibraryAddOnly"
          """
          if 'Permission-Camera' not in src:
              # Insert the pod lines right after the first `target '…' do` line.
              src = re.sub(
                  r"(target ['\"][^'\"]+['\"] do[^\n]*\n)",
                  lambda m: m.group(1) + PERM_PODS,
                  src, count=1
              )
              changed = True
              print("+ react-native-permissions handler pods")
          
          if changed:
              with open(PODFILE, 'w') as f:
                  f.write(src)
              print("Podfile patched.")
          else:
              print("Podfile already up-to-date.")
          PYEOF

      # ── 5. Patch Info.plist ──────────────────────────────────────────────────
      #       Adds privacy usage strings (App Store / runtime requirement) and
      #       registers react-native-vector-icons fonts with iOS.
      - name: Patch Info.plist
        script: |
          INFO_PLIST="app/ios/$APP_NAME/Info.plist"
          [ -f "$INFO_PLIST" ] || { echo "ERROR: Info.plist missing at $INFO_PLIST"; exit 1; }

          # Helper: add a key only if it is not already present
          add_string() {
            local KEY="$1" VAL="$2"
            if ! /usr/libexec/PlistBuddy -c "Print :$KEY" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Add :$KEY string $VAL" "$INFO_PLIST"
              echo "  + $KEY"
            fi
          }

          echo "Privacy usage strings:"
          # react-native-image-picker
          add_string NSCameraUsageDescription          "Used to take photos for your requests and profile."
          add_string NSPhotoLibraryUsageDescription    "Used to attach photos to your requests."
          add_string NSPhotoLibraryAddUsageDescription "Used to save photos from the app."
          # react-native-audio-recorder-player
          add_string NSMicrophoneUsageDescription      "Used for voice messages in chat."
          # react-native-geolocation-service
          add_string NSLocationWhenInUseUsageDescription             "Used to show nearby merchants and requests."
          add_string NSLocationAlwaysAndWhenInUseUsageDescription    "Used to show nearby merchants and requests."
          add_string NSLocationAlwaysUsageDescription                "Used to show nearby merchants and requests."

          echo "UIAppFonts (react-native-vector-icons):"
          # Ensure the array key exists
          if ! /usr/libexec/PlistBuddy -c "Print :UIAppFonts" "$INFO_PLIST" &>/dev/null; then
            /usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "$INFO_PLIST"
          fi

          add_font() {
            local FONT="$1"
            if ! /usr/libexec/PlistBuddy -c "Print :UIAppFonts" "$INFO_PLIST" 2>/dev/null | grep -qF "$FONT"; then
              /usr/libexec/PlistBuddy -c "Add :UIAppFonts: string $FONT" "$INFO_PLIST"
              echo "  + $FONT"
            fi
          }

          add_font AntDesign.ttf
          add_font Entypo.ttf
          add_font EvilIcons.ttf
          add_font Feather.ttf
          add_font FontAwesome.ttf
          add_font FontAwesome5_Brands.ttf
          add_font FontAwesome5_Regular.ttf
          add_font FontAwesome5_Solid.ttf
          add_font Foundation.ttf
          add_font Ionicons.ttf
          add_font MaterialCommunityIcons.ttf
          add_font MaterialIcons.ttf
          add_font Octicons.ttf
          add_font SimpleLineIcons.ttf
          add_font Zocial.ttf

          echo "Info.plist patched."

      # ── 6. CocoaPods ─────────────────────────────────────────────────────────
      - name: Install CocoaPods
        script: |
          pod cache clean boost --all 2>/dev/null || true

          # ── Boost dead-mirror fix ──────────────────────────────────────────
          # boostorg.jfrog.io (JFrog Artifactory) was shut down. curl now gets
          # an HTML error page which tar rejects as "Unrecognized archive format".
          # Switch to archives.boost.io and patch both the URL and sha256 inside
          # react-native's boost.podspec before pod install runs.
          BOOST_VER="1.76.0"
          BOOST_FILE="boost_1_76_0.tar.bz2"
          BOOST_URL="https://archives.boost.io/release/${BOOST_VER}/source/${BOOST_FILE}"
          BOOST_PODSPEC="app/node_modules/react-native/third-party-podspecs/boost.podspec"

          echo "Downloading boost ${BOOST_VER}…"
          curl -L --fail --retry 3 "${BOOST_URL}" -o "/tmp/${BOOST_FILE}"

          # Guard: abort if what we got is not a real bzip2 archive
          if ! file "/tmp/${BOOST_FILE}" | grep -q 'bzip2'; then
            echo "ERROR: download is not a valid bzip2 archive:"
            file "/tmp/${BOOST_FILE}"
            head -c 512 "/tmp/${BOOST_FILE}"
            exit 1
          fi
          echo "Verified: $(file /tmp/${BOOST_FILE})"

          # Patch dead URL in podspec
          sed -i "" \
            "s|boostorg.jfrog.io/artifactory/main/release|archives.boost.io/release|g" \
            "${BOOST_PODSPEC}"

          # Patch sha256 to match what archives.boost.io actually serves
          ACTUAL_SHA=$(shasum -a 256 "/tmp/${BOOST_FILE}" | awk '{print $1}')
          OLD_SHA=$(grep -oE '[a-f0-9]{64}' "${BOOST_PODSPEC}" | head -1)
          echo "Podspec sha256 : ${OLD_SHA}"
          echo "Actual sha256  : ${ACTUAL_SHA}"
          if [ "${OLD_SHA}" != "${ACTUAL_SHA}" ]; then
            sed -i "" "s/${OLD_SHA}/${ACTUAL_SHA}/" "${BOOST_PODSPEC}"
            echo "Patched sha256."
          fi

          # Pre-populate CocoaPods download cache → pod install reuses the file
          PODS_CACHE="${HOME}/Library/Caches/CocoaPods/Pods/External/boost"
          mkdir -p "${PODS_CACHE}"
          cp "/tmp/${BOOST_FILE}" "${PODS_CACHE}/"
          # ──────────────────────────────────────────────────────────────────

          cd app/ios && pod install --repo-update

      # ── 7. Code signing ──────────────────────────────────────────────────────
      - name: Set up code signing
        script: |
          set -e

          # ── Diagnostics: is each secret actually reaching the build? ──────
          # Prints only the character length, never the value. Length 0 means the
          # variable was NOT injected → the 'ios_signing' group name in this YAML
          # does not match the group in the Codemagic UI, or the var is not in it.
          echo "Secret injection check (length 0 = NOT set):"
          echo "  CM_CERTIFICATE            : ${#CM_CERTIFICATE}"
          echo "  CM_CERTIFICATE_PASSWORD   : ${#CM_CERTIFICATE_PASSWORD}"
          echo "  CM_PROVISIONING_PROFILE   : ${#CM_PROVISIONING_PROFILE}"
          echo "  APPLE_TEAM_ID             : ${#APPLE_TEAM_ID}"
          echo "  GOOGLE_SERVICE_INFO_PLIST : ${#GOOGLE_SERVICE_INFO_PLIST}"

          if [ "${#CM_CERTIFICATE}" -eq 0 ]; then
            echo ""
            echo "ERROR: CM_CERTIFICATE is empty in the build environment."
            echo "Fix one of these in the Codemagic UI (App settings → Environment variables):"
            echo "  1. The group containing the secrets must be named EXACTLY 'ios_signing'"
            echo "     (case-sensitive, no spaces). It currently does not match."
            echo "  2. CM_CERTIFICATE must be inside that group (not the default group)."
            echo "  3. After changing groups, save and start a NEW build."
            exit 1
          fi

          # ── Certificate ──────────────────────────────────────────────────
          # printf (not echo) so no trailing newline corrupts the binary.
          printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12

          # Only check the file is non-empty here. We deliberately do NOT validate
          # with `openssl pkcs12`: OpenSSL 3.x rejects Apple .p12 files by default
          # because they use legacy ciphers (3DES/RC2), producing a FALSE failure.
          # macOS `security import` below uses Apple's own crypto and is the real
          # gate — it reads Apple .p12 files correctly regardless of OpenSSL version.
          if [ ! -s /tmp/cert.p12 ]; then
            echo "ERROR: CM_CERTIFICATE decoded to an empty file."
            echo "       The secret is missing or is not valid base64 of a .p12."
            exit 1
          fi

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          if ! security import /tmp/cert.p12 -k build.keychain \
                 -P "$CM_CERTIFICATE_PASSWORD" -T /usr/bin/codesign; then
            echo "ERROR: failed to import the certificate into the keychain."
            echo "       Check CM_CERTIFICATE (base64 of the .p12) and CM_CERTIFICATE_PASSWORD."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain

          # Show the imported signing identity for confirmation in the log
          echo "Imported code-signing identities:"
          security find-identity -v -p codesigning build.keychain || true

          # ── Provisioning profile ─────────────────────────────────────────
          PROFILE_TMP="/tmp/profile.mobileprovision"
          printf '%s' "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_TMP"

          # Decode the CMS-signed profile to a plain plist so we can read it
          if ! security cms -D -i "$PROFILE_TMP" > /tmp/profile.plist 2>/dev/null; then
            echo "ERROR: CM_PROVISIONING_PROFILE is not a valid .mobileprovision."
            echo "First bytes of the decoded secret:"
            head -c 64 "$PROFILE_TMP" | xxd | head
            exit 1
          fi

          # Extract the real UUID and Name (xcodebuild matches by these, NOT filename)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: profile is missing the required UUID property."
            exit 1
          fi
          echo "Provisioning profile: name='$PROFILE_NAME' uuid=$PROFILE_UUID"

          # Install under the UUID filename (Xcode's expected convention)
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$PROFILE_TMP" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

          # Export name + uuid to subsequent build steps via Codemagic's $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$CM_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$CM_ENV"

      # ── 8. Build & archive ───────────────────────────────────────────────────
      - name: Build iOS app
        script: |
          set -o pipefail   # ensure xcodebuild failures are not swallowed by xcpretty
          xcodebuild \
            -workspace "app/ios/$APP_NAME.xcworkspace" \
            -scheme      "$APP_NAME" \
            -configuration Release \
            -sdk         iphoneos \
            -archivePath "/tmp/$APP_NAME.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            | xcpretty

      # ── 9. Export IPA ────────────────────────────────────────────────────────
      #       ExportOptions.plist is built in Python (not a shell heredoc) so the
      #       YAML linter cannot indent the terminator and break it. For manual
      #       ad-hoc signing it must declare signingStyle + the bundle-ID → profile
      #       mapping, otherwise xcodebuild can't pick the right profile to export.
      - name: Export IPA
        script: |
          set -o pipefail

          python3 - <<'PYEOF'
          import os
          
          bundle = os.environ['BUNDLE_ID']
          team   = os.environ['APPLE_TEAM_ID']
          # Prefer the profile name; fall back to UUID. Both are valid here.
          profile = os.environ.get('PROFILE_NAME') or os.environ['PROFILE_UUID']
          
          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"'
              ' "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
              '<plist version="1.0"><dict>',
              '  <key>method</key><string>ad-hoc</string>',
              f'  <key>teamID</key><string>{team}</string>',
              '  <key>signingStyle</key><string>manual</string>',
              '  <key>signingCertificate</key><string>iPhone Distribution</string>',
              '  <key>provisioningProfiles</key>',
              '  <dict>',
              f'    <key>{bundle}</key><string>{profile}</string>',
              '  </dict>',
              '  <key>compileBitcode</key><false/>',
              '</dict></plist>',
          ]
          with open('/tmp/ExportOptions.plist', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          print(f"ExportOptions.plist written: bundle={bundle} profile={profile}")
          PYEOF

          xcodebuild -exportArchive \
            -archivePath       "/tmp/$APP_NAME.xcarchive" \
            -exportPath        /tmp/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            | xcpretty

    artifacts:
      - /tmp/ipa/*.ipa
      - "/tmp/$APP_NAME.xcarchive"
    publishing:
      email:
        recipients:
          - oqdeh93@gmail.com
        notify:
          success: true
          failure: true
  # ─── Android — standalone APK (installable on any device) ────────────────────
  #     Builds a RELEASE APK, not debug. A debug APK loads JS from the Metro dev
  #     server and shows "Could not connect to development server" when installed
  #     by itself. The release APK bundles the JS inside and is signed with the
  #     debug keystore (app/build.gradle → buildTypes.release uses signingConfigs.debug),
  #     so it installs and runs standalone with no Apple/Google account needed.
  android-release:
    name: Android Release APK (standalone)
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: "20.20.0"
      java: "17"
    cache:
      cache_paths:
        - app/node_modules
        - ~/.gradle/caches
    scripts:
      - name: Install Node dependencies
        script: cd app && npm install

      - name: Build release APK (JS bundled, debug-signed)
        script: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Show APK location
        script: |
          echo "Built APKs:"
          ls -lh app/android/app/build/outputs/apk/release/*.apk

    artifacts:
      - app/android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - oqdeh93@gmail.com
        notify:
          success: true
          failure: true


  # ─── iOS — Simulator build (NO Apple account, runs in browser via Appetize) ──
  #     Builds an UNSIGNED .app for the iOS Simulator. No certificate, no
  #     provisioning profile, no ios_signing group needed. Produces a zipped .app
  #     that you upload to https://appetize.io to run the iOS app in a browser.
  #     Uses Release config so the JS bundle is embedded (runs without Metro).
  ios-simulator:
    name: iOS Simulator (.app for Appetize)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        APP_NAME:   ReverseMarketplaceBuyer
        BUNDLE_ID:  com.reversemarketplacebuyer
        NO_FLIPPER: "1"
      node: "20.20.0"
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - app/node_modules
        - app/ios/Pods
    scripts:

      # ── 1. Node dependencies ─────────────────────────────────────────────────
      - name: Install Node dependencies
        script: cd app && npm install

      # ── 2. Generate ios/ from the RN template ────────────────────────────────
      - name: Generate iOS project from template
        script: |
          if [ -d "app/ios" ] && [ -f "app/ios/Podfile" ]; then
            echo "ios/ already exists — skipping generation."
            exit 0
          fi

          TEMPLATE="app/node_modules/react-native/template/ios"
          if [ ! -d "$TEMPLATE" ]; then
            echo "ERROR: RN template not found at $TEMPLATE"
            exit 1
          fi

          if [ -d "app/ios/Pods" ]; then
            echo "Preserving cached Pods…"
            mv app/ios/Pods /tmp/_ios_pods_cache
          fi
          rm -rf app/ios
          cp -r "$TEMPLATE" app/ios
          if [ -d "/tmp/_ios_pods_cache" ]; then
            mv /tmp/_ios_pods_cache app/ios/Pods
            echo "Pods cache restored."
          fi

          PLACEHOLDER=$(ls app/ios | grep '\.xcodeproj$' | head -1 | sed 's/\.xcodeproj$//')
          if [ -z "$PLACEHOLDER" ]; then
            echo "ERROR: could not detect placeholder (.xcodeproj not found)."
            ls -la app/ios/
            exit 1
          fi
          echo "Placeholder: $PLACEHOLDER → $APP_NAME"

          find app/ios -type f \( \
            -name "*.h"          -o -name "*.m"          -o -name "*.mm"       \
            -o -name "*.swift"   -o -name "*.plist"       -o -name "*.storyboard" \
            -o -name "*.pbxproj" -o -name "*.xcscheme"    -o -name "Podfile" \) \
            -exec sed -i "" "s/$PLACEHOLDER/$APP_NAME/g" {} \;

          find app/ios -depth -name "*${PLACEHOLDER}*" | while IFS= read -r old; do
            dir=$(dirname "$old")
            base=$(basename "$old")
            newbase="${base//$PLACEHOLDER/$APP_NAME}"
            if [ "$base" != "$newbase" ]; then
              mv "$dir/$base" "$dir/$newbase"
            fi
          done

          if [ ! -d "app/ios/$APP_NAME" ]; then
            echo "ERROR: expected app/ios/$APP_NAME to be a directory after generation."
            ls -la app/ios/
            exit 1
          fi

          SCHEME="app/ios/$APP_NAME.xcodeproj/xcshareddata/xcschemes/$APP_NAME.xcscheme"
          if [ ! -f "$SCHEME" ]; then
            echo "ERROR: expected shared scheme not found at $SCHEME"
            find "app/ios/$APP_NAME.xcodeproj" -name "*.xcscheme" 2>/dev/null
            exit 1
          fi
          echo "Scheme OK: $SCHEME"

          INFO_PLIST="app/ios/$APP_NAME/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$INFO_PLIST"
            echo "Bundle ID → $BUNDLE_ID"
          fi
          echo "ios/ folder ready."

      # ── 3. GoogleService-Info.plist (placeholder is fine for simulator) ──────
      - name: Set up GoogleService-Info.plist
        script: |
          python3 - <<'PYEOF'
          import os, base64

          APP_NAME  = os.environ['APP_NAME']
          BUNDLE_ID = os.environ['BUNDLE_ID']
          plist_dir  = f"app/ios/{APP_NAME}"
          plist_path = f"{plist_dir}/GoogleService-Info.plist"
          os.makedirs(plist_dir, exist_ok=True)

          secret = os.environ.get('GOOGLE_SERVICE_INFO_PLIST', '').strip()
          if secret:
              with open(plist_path, 'wb') as f:
                  f.write(base64.b64decode(secret))
              print("GoogleService-Info.plist injected from secret.")
          else:
              print("No secret set — writing placeholder (fine for simulator).")
              lines = [
                  '<?xml version="1.0" encoding="UTF-8"?>',
                  '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"'
                  ' "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
                  '<plist version="1.0">',
                  '<dict>',
                  '  <key>API_KEY</key>               <string>placeholder</string>',
                  '  <key>GCM_SENDER_ID</key>         <string>000000000000</string>',
                  '  <key>PLIST_VERSION</key>         <string>1</string>',
                  f'  <key>BUNDLE_ID</key>             <string>{BUNDLE_ID}</string>',
                  '  <key>PROJECT_ID</key>            <string>placeholder-project</string>',
                  '  <key>STORAGE_BUCKET</key>        <string>placeholder-project.appspot.com</string>',
                  '  <key>IS_ADS_ENABLED</key>        <false/>',
                  '  <key>IS_ANALYTICS_ENABLED</key>  <false/>',
                  '  <key>IS_APPINVITE_ENABLED</key>  <false/>',
                  '  <key>IS_GCM_ENABLED</key>        <true/>',
                  '  <key>IS_SIGNIN_ENABLED</key>     <false/>',
                  '  <key>GOOGLE_APP_ID</key>         <string>1:000000000000:ios:0000000000000000000000</string>',
                  '</dict>',
                  '</plist>',
              ]
              with open(plist_path, 'w') as f:
                  f.write('\n'.join(lines) + '\n')
              print("Placeholder written.")
          PYEOF

      # ── 4. Patch Podfile (same fixes as the device build) ────────────────────
      - name: Patch Podfile
        script: |
          PODFILE="app/ios/Podfile"
          [ -f "$PODFILE" ] || { echo "ERROR: Podfile missing"; exit 1; }

          python3 - <<'PYEOF'
          import re

          PODFILE = "app/ios/Podfile"
          with open(PODFILE) as f:
              src = f.read()
          changed = False

          if '$RNFirebaseAsStaticFramework' not in src:
              src = '$RNFirebaseAsStaticFramework = true\n\n' + src
              changed = True
              print("+ $RNFirebaseAsStaticFramework = true")

          if 'use_modular_headers!' not in src:
              src = re.sub(r'(platform :ios[^\n]*\n)', r'\1use_modular_headers!\n', src, count=1)
              changed = True
              print("+ use_modular_headers!")

          PERM_PODS = """\
            permissions_path = '../node_modules/react-native-permissions/ios'
            pod 'Permission-Camera',              :path => "#{permissions_path}/Camera"
            pod 'Permission-LocationAlways',      :path => "#{permissions_path}/LocationAlways"
            pod 'Permission-LocationWhenInUse',   :path => "#{permissions_path}/LocationWhenInUse"
            pod 'Permission-Microphone',          :path => "#{permissions_path}/Microphone"
            pod 'Permission-Notifications',       :path => "#{permissions_path}/Notifications"
            pod 'Permission-PhotoLibrary',        :path => "#{permissions_path}/PhotoLibrary"
            pod 'Permission-PhotoLibraryAddOnly', :path => "#{permissions_path}/PhotoLibraryAddOnly"
          """
          if 'Permission-Camera' not in src:
              src = re.sub(
                  r"(target ['\"][^'\"]+['\"] do[^\n]*\n)",
                  lambda m: m.group(1) + PERM_PODS,
                  src, count=1
              )
              changed = True
              print("+ react-native-permissions handler pods")

          if changed:
              with open(PODFILE, 'w') as f:
                  f.write(src)
              print("Podfile patched.")
          else:
              print("Podfile already up-to-date.")
          PYEOF

      # ── 5. Patch Info.plist (privacy strings + vector-icon fonts) ────────────
      - name: Patch Info.plist
        script: |
          INFO_PLIST="app/ios/$APP_NAME/Info.plist"
          [ -f "$INFO_PLIST" ] || { echo "ERROR: Info.plist missing at $INFO_PLIST"; exit 1; }

          add_string() {
            local KEY="$1" VAL="$2"
            if ! /usr/libexec/PlistBuddy -c "Print :$KEY" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Add :$KEY string $VAL" "$INFO_PLIST"
              echo "  + $KEY"
            fi
          }

          add_string NSCameraUsageDescription          "Used to take photos for your requests and profile."
          add_string NSPhotoLibraryUsageDescription    "Used to attach photos to your requests."
          add_string NSPhotoLibraryAddUsageDescription "Used to save photos from the app."
          add_string NSMicrophoneUsageDescription      "Used for voice messages in chat."
          add_string NSLocationWhenInUseUsageDescription          "Used to show nearby merchants and requests."
          add_string NSLocationAlwaysAndWhenInUseUsageDescription "Used to show nearby merchants and requests."
          add_string NSLocationAlwaysUsageDescription             "Used to show nearby merchants and requests."

          if ! /usr/libexec/PlistBuddy -c "Print :UIAppFonts" "$INFO_PLIST" &>/dev/null; then
            /usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "$INFO_PLIST"
          fi
          add_font() {
            local FONT="$1"
            if ! /usr/libexec/PlistBuddy -c "Print :UIAppFonts" "$INFO_PLIST" 2>/dev/null | grep -qF "$FONT"; then
              /usr/libexec/PlistBuddy -c "Add :UIAppFonts: string $FONT" "$INFO_PLIST"
              echo "  + $FONT"
            fi
          }
          for f in AntDesign Entypo EvilIcons Feather FontAwesome FontAwesome5_Brands \
                   FontAwesome5_Regular FontAwesome5_Solid Foundation Ionicons \
                   MaterialCommunityIcons MaterialIcons Octicons SimpleLineIcons Zocial; do
            add_font "$f.ttf"
          done
          echo "Info.plist patched."

      # ── 6. CocoaPods (with boost dead-mirror fix) ────────────────────────────
      - name: Install CocoaPods
        script: |
          pod cache clean boost --all 2>/dev/null || true

          BOOST_VER="1.76.0"
          BOOST_FILE="boost_1_76_0.tar.bz2"
          BOOST_URL="https://archives.boost.io/release/${BOOST_VER}/source/${BOOST_FILE}"
          BOOST_PODSPEC="app/node_modules/react-native/third-party-podspecs/boost.podspec"

          echo "Downloading boost ${BOOST_VER}…"
          curl -L --fail --retry 3 "${BOOST_URL}" -o "/tmp/${BOOST_FILE}"
          if ! file "/tmp/${BOOST_FILE}" | grep -q 'bzip2'; then
            echo "ERROR: download is not a valid bzip2 archive:"
            file "/tmp/${BOOST_FILE}"; head -c 512 "/tmp/${BOOST_FILE}"; exit 1
          fi
          sed -i "" "s|boostorg.jfrog.io/artifactory/main/release|archives.boost.io/release|g" "${BOOST_PODSPEC}"
          ACTUAL_SHA=$(shasum -a 256 "/tmp/${BOOST_FILE}" | awk '{print $1}')
          OLD_SHA=$(grep -oE '[a-f0-9]{64}' "${BOOST_PODSPEC}" | head -1)
          if [ "${OLD_SHA}" != "${ACTUAL_SHA}" ]; then
            sed -i "" "s/${OLD_SHA}/${ACTUAL_SHA}/" "${BOOST_PODSPEC}"
          fi
          PODS_CACHE="${HOME}/Library/Caches/CocoaPods/Pods/External/boost"
          mkdir -p "${PODS_CACHE}"
          cp "/tmp/${BOOST_FILE}" "${PODS_CACHE}/"

          cd app/ios && pod install --repo-update

      # ── 7. Build UNSIGNED .app for the iOS Simulator ─────────────────────────
      - name: Build for iOS Simulator (no signing)
        script: |
          set -o pipefail
          xcodebuild \
            -workspace "app/ios/$APP_NAME.xcworkspace" \
            -scheme      "$APP_NAME" \
            -configuration Release \
            -sdk         iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/derived \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcpretty

      # ── 8. Zip the .app for Appetize.io upload ───────────────────────────────
      - name: Package .app for Appetize
        script: |
          APP_PATH="/tmp/derived/Build/Products/Release-iphonesimulator/$APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: built .app not found at $APP_PATH"
            find /tmp/derived/Build/Products -name "*.app" -maxdepth 2 2>/dev/null
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          # -y preserves symlinks inside the .app bundle (required by Appetize)
          zip -r -y "/tmp/$APP_NAME-simulator.app.zip" "$APP_NAME.app"
          echo "Packaged:"
          ls -lh "/tmp/$APP_NAME-simulator.app.zip"

    artifacts:
      - /tmp/*-simulator.app.zip
    publishing:
      email:
        recipients:
          - oqdeh93@gmail.com
        notify:
          success: true
          failure: true