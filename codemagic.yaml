workflows:

  # ─── iOS — real device build ─────────────────────────────────────────────────
  ios-device:
    name: iOS Device (Ad Hoc)
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      vars:
        APP_NAME:   ReverseMarketplaceBuyer
        BUNDLE_ID:  com.reversemarketplacebuyer
        NO_FLIPPER: "1"    # Flipper conflicts with Firebase on RN 0.72 — keep disabled
      node: "20.20.0"
      xcode: latest
      cocoapods: default
      # ── Required secrets (set in Codemagic UI → Environment Variables) ──────
      #   APPLE_TEAM_ID             — 10-char Apple Developer Team ID
      #   CM_CERTIFICATE            — base64 of .p12 distribution certificate
      #   CM_CERTIFICATE_PASSWORD   — .p12 password
      #   CM_PROVISIONING_PROFILE   — base64 of Ad Hoc .mobileprovision
      #   GOOGLE_SERVICE_INFO_PLIST — base64 of GoogleService-Info.plist (Firebase)
      #                               Generate: base64 -i GoogleService-Info.plist | pbcopy

    cache:
      cache_paths:
        - app/node_modules
        - app/ios/Pods

    scripts:

      # ── 1. Node dependencies ─────────────────────────────────────────────────
      - name: Install Node dependencies
        script: cd app && npm install

      # ── 2. Generate ios/ from the RN template ────────────────────────────────
      #       Skipped when ios/Podfile already exists in the repo.
      - name: Generate iOS project from template
        script: |
          if [ -d "app/ios" ] && [ -f "app/ios/Podfile" ]; then
            echo "ios/ already exists — skipping generation."
            exit 0
          fi

          TEMPLATE="app/node_modules/react-native/template/ios"
          if [ ! -d "$TEMPLATE" ]; then
            echo "ERROR: RN template not found at $TEMPLATE"
            exit 1
          fi

          # ── Fix: cp -r into an existing directory copies the source as a
          # subdirectory (app/ios/ios/), not in-place.  We must remove app/ios/
          # first so the template lands AS app/ios/ (the correct level).
          # Preserve any Pods that Codemagic already restored from cache.
          if [ -d "app/ios/Pods" ]; then
            echo "Preserving cached Pods…"
            mv app/ios/Pods /tmp/_ios_pods_cache
          fi
          rm -rf app/ios
          cp -r "$TEMPLATE" app/ios
          if [ -d "/tmp/_ios_pods_cache" ]; then
            mv /tmp/_ios_pods_cache app/ios/Pods
            echo "Pods cache restored."
          fi

          # Detect the placeholder name used by this template (e.g. "HelloWorld")
          PLACEHOLDER=$(ls app/ios | grep -v "Tests\|\.xcodeproj\|Podfile\|\.xcworkspace" | head -1)
          echo "Placeholder: $PLACEHOLDER → $APP_NAME"

          # Replace placeholder → APP_NAME in every source file
          # macOS BSD sed requires an explicit empty-string extension after -i
          find app/ios -type f \( \
            -name "*.h"          -o -name "*.m"          -o -name "*.mm"       \
            -o -name "*.swift"   -o -name "*.plist"       -o -name "*.storyboard" \
            -o -name "*.pbxproj" -o -name "*.xcscheme"    -o -name "Podfile" \) \
            -exec sed -i "" "s/$PLACEHOLDER/$APP_NAME/g" {} \;

          # Rename directories and files (deepest first so parents still match)
          find app/ios -name "*${PLACEHOLDER}*" | sort -r | while IFS= read -r old; do
            new="${old//$PLACEHOLDER/$APP_NAME}"
            [ "$old" != "$new" ] && mv "$old" "$new"
          done

          # Confirm the expected app directory was produced
          if [ ! -d "app/ios/$APP_NAME" ]; then
            echo "ERROR: expected app/ios/$APP_NAME to be a directory after generation."
            echo "Contents of app/ios/:"
            ls -la app/ios/
            exit 1
          fi

          # Set bundle ID
          INFO_PLIST="app/ios/$APP_NAME/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$INFO_PLIST"
            echo "Bundle ID → $BUNDLE_ID"
          fi

          echo "ios/ folder ready."

      # ── 3. GoogleService-Info.plist ──────────────────────────────────────────
      #       @react-native-firebase adds a Copy build phase that FAILS at
      #       archive time if this file is absent.  Decode from the secret
      #       env var; fall back to a structure-valid placeholder so the build
      #       still completes (Firebase won't connect but the IPA is produced).
      #
      #       Written in Python (not a shell heredoc) so YAML linter indentation
      #       cannot break the terminator and cause "unexpected end of file".
      - name: Set up GoogleService-Info.plist
        script: |
          python3 - <<'PYEOF'
          import os, base64
          
          APP_NAME  = os.environ['APP_NAME']
          BUNDLE_ID = os.environ['BUNDLE_ID']
          plist_dir  = f"app/ios/{APP_NAME}"
          plist_path = f"{plist_dir}/GoogleService-Info.plist"
          
          os.makedirs(plist_dir, exist_ok=True)
          
          secret = os.environ.get('GOOGLE_SERVICE_INFO_PLIST', '').strip()
          if secret:
              with open(plist_path, 'wb') as f:
                  f.write(base64.b64decode(secret))
              print("GoogleService-Info.plist injected from secret.")
          else:
              print("WARNING: GOOGLE_SERVICE_INFO_PLIST not set — writing structure-valid placeholder.")
              lines = [
                  '<?xml version="1.0" encoding="UTF-8"?>',
                  '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"'
                  ' "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
                  '<plist version="1.0">',
                  '<dict>',
                  '  <key>API_KEY</key>               <string>placeholder</string>',
                  '  <key>GCM_SENDER_ID</key>         <string>000000000000</string>',
                  '  <key>PLIST_VERSION</key>         <string>1</string>',
                  f'  <key>BUNDLE_ID</key>             <string>{BUNDLE_ID}</string>',
                  '  <key>PROJECT_ID</key>            <string>placeholder-project</string>',
                  '  <key>STORAGE_BUCKET</key>        <string>placeholder-project.appspot.com</string>',
                  '  <key>IS_ADS_ENABLED</key>        <false/>',
                  '  <key>IS_ANALYTICS_ENABLED</key>  <false/>',
                  '  <key>IS_APPINVITE_ENABLED</key>  <false/>',
                  '  <key>IS_GCM_ENABLED</key>        <true/>',
                  '  <key>IS_SIGNIN_ENABLED</key>     <false/>',
                  '  <key>GOOGLE_APP_ID</key>         <string>1:000000000000:ios:0000000000000000000000</string>',
                  '</dict>',
                  '</plist>',
              ]
              with open(plist_path, 'w') as f:
                  f.write('\n'.join(lines) + '\n')
              print("Placeholder written.")
          PYEOF

      # ── 4. Patch Podfile ─────────────────────────────────────────────────────
      #       Fixes three issues that every build hits with this dependency set:
      #         a) Firebase Swift pods need GoogleUtilities module maps
      #         b) react-native-permissions 3.x needs setup_permissions([...])
      #         c) $RNFirebaseAsStaticFramework for static-library Firebase
      - name: Patch Podfile
        script: |
          PODFILE="app/ios/Podfile"
          [ -f "$PODFILE" ] || { echo "ERROR: Podfile missing"; exit 1; }

          python3 - <<'PYEOF'
          import re
          
          PODFILE = "app/ios/Podfile"
          with open(PODFILE) as f:
              src = f.read()
          
          changed = False
          
          # ── a) $RNFirebaseAsStaticFramework ──────────────────────────────────────────
          # Must be declared before any `require` so @react-native-firebase and
          # react-native-maps (Google Maps) configure Firebase as static frameworks.
          if '$RNFirebaseAsStaticFramework' not in src:
              src = '$RNFirebaseAsStaticFramework = true\n\n' + src
              changed = True
              print("+ $RNFirebaseAsStaticFramework = true")
          
          # ── b) use_modular_headers! ───────────────────────────────────────────────────
          # FirebaseCoreInternal (Swift) imports GoogleUtilities which has no module map.
          # CocoaPods generates one automatically when this flag is present.
          if 'use_modular_headers!' not in src:
              src = re.sub(r'(platform :ios[^\n]*\n)', r'\1use_modular_headers!\n', src, count=1)
              changed = True
              print("+ use_modular_headers!")
          
          # ── c) setup_permissions for react-native-permissions 3.x ───────────────────
          # Without this, the permission handler implementations are not compiled into
          # the binary and every permission check returns "unavailable" at runtime.
          PERMS = """\
          
          # react-native-permissions: include only the handlers the app uses
          setup_permissions([
            'Camera',
            'LocationAlways',
            'LocationWhenInUse',
            'Microphone',
            'Notifications',
            'PhotoLibrary',
            'PhotoLibraryAddOnly',
          ])
          
          """
          if 'setup_permissions' not in src:
              src = re.sub(r'(^target\b)', PERMS + r'\1', src, count=1, flags=re.MULTILINE)
              changed = True
              print("+ setup_permissions([...])")
          
          if changed:
              with open(PODFILE, 'w') as f:
                  f.write(src)
              print("Podfile patched.")
          else:
              print("Podfile already up-to-date.")
          PYEOF

      # ── 5. Patch Info.plist ──────────────────────────────────────────────────
      #       Adds privacy usage strings (App Store / runtime requirement) and
      #       registers react-native-vector-icons fonts with iOS.
      - name: Patch Info.plist
        script: |
          INFO_PLIST="app/ios/$APP_NAME/Info.plist"
          [ -f "$INFO_PLIST" ] || { echo "ERROR: Info.plist missing at $INFO_PLIST"; exit 1; }

          # Helper: add a key only if it is not already present
          add_string() {
            local KEY="$1" VAL="$2"
            if ! /usr/libexec/PlistBuddy -c "Print :$KEY" "$INFO_PLIST" &>/dev/null; then
              /usr/libexec/PlistBuddy -c "Add :$KEY string $VAL" "$INFO_PLIST"
              echo "  + $KEY"
            fi
          }

          echo "Privacy usage strings:"
          # react-native-image-picker
          add_string NSCameraUsageDescription          "Used to take photos for your requests and profile."
          add_string NSPhotoLibraryUsageDescription    "Used to attach photos to your requests."
          add_string NSPhotoLibraryAddUsageDescription "Used to save photos from the app."
          # react-native-audio-recorder-player
          add_string NSMicrophoneUsageDescription      "Used for voice messages in chat."
          # react-native-geolocation-service
          add_string NSLocationWhenInUseUsageDescription             "Used to show nearby merchants and requests."
          add_string NSLocationAlwaysAndWhenInUseUsageDescription    "Used to show nearby merchants and requests."
          add_string NSLocationAlwaysUsageDescription                "Used to show nearby merchants and requests."

          echo "UIAppFonts (react-native-vector-icons):"
          # Ensure the array key exists
          if ! /usr/libexec/PlistBuddy -c "Print :UIAppFonts" "$INFO_PLIST" &>/dev/null; then
            /usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "$INFO_PLIST"
          fi

          add_font() {
            local FONT="$1"
            if ! /usr/libexec/PlistBuddy -c "Print :UIAppFonts" "$INFO_PLIST" 2>/dev/null | grep -qF "$FONT"; then
              /usr/libexec/PlistBuddy -c "Add :UIAppFonts: string $FONT" "$INFO_PLIST"
              echo "  + $FONT"
            fi
          }

          add_font AntDesign.ttf
          add_font Entypo.ttf
          add_font EvilIcons.ttf
          add_font Feather.ttf
          add_font FontAwesome.ttf
          add_font FontAwesome5_Brands.ttf
          add_font FontAwesome5_Regular.ttf
          add_font FontAwesome5_Solid.ttf
          add_font Foundation.ttf
          add_font Ionicons.ttf
          add_font MaterialCommunityIcons.ttf
          add_font MaterialIcons.ttf
          add_font Octicons.ttf
          add_font SimpleLineIcons.ttf
          add_font Zocial.ttf

          echo "Info.plist patched."

      # ── 6. CocoaPods ─────────────────────────────────────────────────────────
      - name: Install CocoaPods
        script: |
          pod cache clean boost --all 2>/dev/null || true

          # ── Boost dead-mirror fix ──────────────────────────────────────────
          # boostorg.jfrog.io (JFrog Artifactory) was shut down. curl now gets
          # an HTML error page which tar rejects as "Unrecognized archive format".
          # Switch to archives.boost.io and patch both the URL and sha256 inside
          # react-native's boost.podspec before pod install runs.
          BOOST_VER="1.76.0"
          BOOST_FILE="boost_1_76_0.tar.bz2"
          BOOST_URL="https://archives.boost.io/release/${BOOST_VER}/source/${BOOST_FILE}"
          BOOST_PODSPEC="app/node_modules/react-native/third-party-podspecs/boost.podspec"

          echo "Downloading boost ${BOOST_VER}…"
          curl -L --fail --retry 3 "${BOOST_URL}" -o "/tmp/${BOOST_FILE}"

          # Guard: abort if what we got is not a real bzip2 archive
          if ! file "/tmp/${BOOST_FILE}" | grep -q 'bzip2'; then
            echo "ERROR: download is not a valid bzip2 archive:"
            file "/tmp/${BOOST_FILE}"
            head -c 512 "/tmp/${BOOST_FILE}"
            exit 1
          fi
          echo "Verified: $(file /tmp/${BOOST_FILE})"

          # Patch dead URL in podspec
          sed -i "" \
            "s|boostorg.jfrog.io/artifactory/main/release|archives.boost.io/release|g" \
            "${BOOST_PODSPEC}"

          # Patch sha256 to match what archives.boost.io actually serves
          ACTUAL_SHA=$(shasum -a 256 "/tmp/${BOOST_FILE}" | awk '{print $1}')
          OLD_SHA=$(grep -oE '[a-f0-9]{64}' "${BOOST_PODSPEC}" | head -1)
          echo "Podspec sha256 : ${OLD_SHA}"
          echo "Actual sha256  : ${ACTUAL_SHA}"
          if [ "${OLD_SHA}" != "${ACTUAL_SHA}" ]; then
            sed -i "" "s/${OLD_SHA}/${ACTUAL_SHA}/" "${BOOST_PODSPEC}"
            echo "Patched sha256."
          fi

          # Pre-populate CocoaPods download cache → pod install reuses the file
          PODS_CACHE="${HOME}/Library/Caches/CocoaPods/Pods/External/boost"
          mkdir -p "${PODS_CACHE}"
          cp "/tmp/${BOOST_FILE}" "${PODS_CACHE}/"
          # ──────────────────────────────────────────────────────────────────

          cd app/ios && pod install --repo-update

      # ── 7. Code signing ──────────────────────────────────────────────────────
      - name: Set up code signing
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CM_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # ── 8. Build & archive ───────────────────────────────────────────────────
      - name: Build iOS app
        script: |
          set -o pipefail   # ensure xcodebuild failures are not swallowed by xcpretty
          xcodebuild \
            -workspace "app/ios/$APP_NAME.xcworkspace" \
            -scheme      "$APP_NAME" \
            -configuration Release \
            -sdk         iphoneos \
            -archivePath "/tmp/$APP_NAME.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="profile" \
            | xcpretty

      # ── 9. Export IPA ────────────────────────────────────────────────────────
      - name: Export IPA
        script: |
          set -o pipefail
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key>          <string>ad-hoc</string>
            <key>teamID</key>          <string>$APPLE_TEAM_ID</string>
            <key>compileBitcode</key>  <false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath       "/tmp/$APP_NAME.xcarchive" \
            -exportPath        /tmp/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            | xcpretty

    artifacts:
      - /tmp/ipa/*.ipa
      - "/tmp/$APP_NAME.xcarchive"

    publishing:
      email:
        recipients:
          - oqdeh93@gmail.com
        notify:
          success: true
          failure: true


  # ─── Android — APK debug build ───────────────────────────────────────────────
  android-debug:
    name: Android Debug APK
    instance_type: linux_x2
    max_build_duration: 30

    environment:
      node: "20.20.0"
      java: "17"

    cache:
      cache_paths:
        - app/node_modules
        - ~/.gradle/caches

    scripts:
      - name: Install Node dependencies
        script: cd app && npm install

      - name: Build debug APK
        script: cd app/android && ./gradlew assembleDebug

    artifacts:
      - app/android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - oqdeh93@gmail.com
        notify:
          success: true
          failure: true
